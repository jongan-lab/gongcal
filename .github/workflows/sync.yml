name: 노션 동기화 및 배포

on:
  schedule:
    - cron: "7 * * * *" # 매시 7분 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch: {} # Actions 탭에서 '지금 바로' 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 노션에서 데이터 가져오기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::NOTION_TOKEN 시크릿이 없어 노션 동기화를 건너뛰고 기존 data.json으로 배포합니다."
          else
            node scripts/sync-notion.mjs
          fi

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "노션 데이터 동기화"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
