<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="공기업 채용 전형 일정을 한눈에 보는 달력">
<title>공기업 채용 달력</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%231C4E8A'/%3E%3Crect x='3' y='5' width='26' height='7' rx='3' fill='%2316406F'/%3E%3Ccircle cx='16' cy='20' r='4' fill='%23fff'/%3E%3C/svg%3E">
<script>
// 첫 화면부터 저장된 보기 모드로 그려 깜빡임을 막는다
try{var v=(JSON.parse(localStorage.getItem("gongcal-pub:prefs:v1")||"{}").viewA)||"auto";
  if(v==="mobile"||(v==="auto"&&window.matchMedia("(max-width:899px)").matches))document.documentElement.classList.add("m");}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=__V__">
<script>
// 디자인 시안 미리보기: ?theme=1|2|3 이면 themes/tN.css 를 덧입힌다
(function(){var m=location.search.match(/[?&]theme=([1-9])/);if(!m)return;
  document.documentElement.setAttribute("data-skin","t"+m[1]);
  document.write('<link rel="stylesheet" href="themes/t'+m[1]+'.css?v=__V__">');})();
</script>
<style>
.logo,.hstats{display:none}
/* A안: 달력 중심. 폰에서는 점으로 표시한 달력 + 고른 날의 일정 목록 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{flex:1 1 auto;min-width:0}
.brand .brow{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.caution{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink2);display:flex;gap:4px;word-break:keep-all}
.caution b{color:var(--s-examRes);font-weight:700;flex:0 0 auto}
.stamp{font-size:12px;color:var(--ink2);white-space:nowrap}
.tools{display:flex;gap:8px;flex:1 1 320px;max-width:520px;min-width:0}
.searchbox{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 10px;height:40px;min-width:0}
.searchbox svg{width:18px;height:18px;color:var(--ink2);flex:0 0 auto}
.searchbox input{border:0;background:none;outline:none;flex:1;min-width:0;width:0;height:100%}
.fbtn{position:relative}
.badge{position:absolute;top:-5px;right:-5px;background:var(--sun);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;line-height:17px;text-align:center;display:none}
.badge.show{display:block}

.wrap{max-width:1360px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.hl{margin-bottom:14px}
.hl h2{font-size:13px;color:var(--ink2);font-weight:600;margin:0 0 8px}
.hlrow{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 0 6px;scrollbar-width:thin}
.hlc{flex:0 0 auto;width:148px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow);border-top:3px solid var(--c)}
.hlc .k{font-size:12px;font-weight:700;color:var(--c)}
.hlc .n{font-size:22px;font-weight:700;line-height:1.15;color:var(--c);font-variant-numeric:tabular-nums}
.hlc .c{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlc .d{font-size:12px;color:var(--ink2)}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.side{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
main.view{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--ink2);min-height:38px}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.calhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.calhead .ym{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:auto}
.calhead .nav{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;font-size:18px;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{font-size:12px;font-weight:600;color:var(--ink2);padding:6px 4px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;position:relative}
.cell:hover{background:var(--soft)}
.cell.out{background:var(--soft)}
.cell.out .dn{opacity:.4}
.cell.sel{box-shadow:inset 0 0 0 2px var(--sel)}
.dn{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:22px}
.dn span{display:inline-block;min-width:22px;text-align:center;border-radius:999px}
.dn.sun{color:var(--sun)} .dn.sat{color:var(--sat)}
.cell.today .dn span{background:var(--sun);color:#fff}
.ec{display:flex;align-items:center;gap:4px;border:0;background:none;padding:1px 3px;border-radius:4px;font-size:12px;text-align:left;width:100%;min-width:0}
.ec:hover{background:var(--panel)}
.ec .bar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto;background:var(--c)}
.ec .s{font-weight:600;flex:0 0 auto;color:var(--c)}
.ec .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ec.exam{background:color-mix(in srgb,var(--s-exam) 12%,transparent)}
.moren{font-size:11.5px;color:var(--brand);font-weight:600;padding:0 3px}
.dotrow{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding-top:2px}
.edot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dotrow .moren{font-size:10px;line-height:7px;padding:0;color:var(--ink2)}

.daypanel{margin-top:14px}
.daypanel h2{font-size:16px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.daypanel h2 small{font-size:12.5px;color:var(--ink2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

.rangebtns{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.agh{font-size:14px;font-weight:700;margin:16px 0 6px;display:flex;gap:8px;align-items:baseline}
.agh:first-of-type{margin-top:6px}
.agh small{color:var(--ink2);font-weight:600;font-size:12.5px}
.agh.sun{color:var(--sun)} .agh.sat{color:var(--sat)}
.note{font-size:12.5px;color:var(--ink2);margin-bottom:10px}

.vbtn{display:inline-flex;align-items:center;gap:5px;height:40px;white-space:nowrap;flex:0 0 auto}
.vbtn svg{width:17px;height:17px}

/* 화면 모드: html.m = 모바일 보기 (폭에 따라 자동, 또는 버튼으로 직접 선택) */
html.m .tools{max-width:none;flex-basis:100%}
html.m .layout{grid-template-columns:1fr}
html.m .side{display:none}
html.m main.view{background:none;box-shadow:none;padding:0}
html.m .calbox,html.m .listbox{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 10px}
html.m .cal{border-radius:8px}
html.m .cell{min-height:58px;padding:4px 1px 6px;align-items:center}
html.m .cell.today .dn span{min-width:26px}
html.m .dn{font-size:13.5px}
html.m .dow{padding:5px 0}
html.m .wrap,html.m .top-in{max-width:560px}
/* PC 보기: 넓은 화면은 왼쪽 필터, 좁은 폰에서 고르면 달력을 옆으로 밀어 보기 */
@media (min-width:900px){ html:not(.m) .fbtn{display:none} }
@media (max-width:899px){
  html:not(.m) .layout{grid-template-columns:1fr}
  html:not(.m) .side{display:none}
  html:not(.m) .calscroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
  html:not(.m) .cal{min-width:760px}
  html:not(.m) .tools{max-width:none;flex-basis:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brow"><span class="logo" aria-label="마킹PT">마킹<b>PT</b></span><h1>공기업 채용 달력</h1><span class="stamp" id="stamp"></span></div>
      <p class="caution"><b aria-hidden="true">※</b><span>채용공고 기준으로 전형별 날짜를 정확히 공개하지 않은 기업의 일정은 임의로 설정되었을 수 있으니 반드시 채용공고도 같이 체크하세요.</span></p>
    </div>
    <div class="hstats" id="hstats" aria-label="요약"></div>
    <div class="tools">
      <label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">기업 검색</span><input id="q" type="search" placeholder="기업 검색 (예: 한국전력)" autocomplete="off"></label>
      <button class="iconbtn fbtn" id="fbtn" aria-label="필터"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="badge" id="fbadge"></span></button>
      <button class="btn vbtn" id="vbtn"></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="notice" id="notice" role="status"></div>
  <section class="hl" id="hlsec" aria-labelledby="hlh">
    <h2 id="hlh">놓치면 안 되는 일정</h2>
    <div class="hlrow" id="hl"></div>
  </section>
  <div class="layout">
    <aside class="side" id="side" aria-label="필터"></aside>
    <main class="view">
      <div class="seg" role="tablist">
        <button role="tab" data-tab="cal">달력</button>
        <button role="tab" data-tab="agenda">다가오는 일정</button>
        <button role="tab" data-tab="co">기업별 현황</button>
      </div>
      <div id="pane"></div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sTitle">
  <div class="grab"></div>
  <div class="shead"><div><h2 id="sTitle"></h2><div class="meta" id="sMeta"></div></div><button class="x" id="sClose" aria-label="닫기">×</button></div>
  <div class="sbody" id="sBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script src="common.js?v=__V__"></script>
<script>
(function(){
"use strict";
var GC=window.GC,el=GC.el,$=GC.$,prefs=GC.prefs;
prefs.tabA=prefs.tabA||"cal";
var st={month:null,sel:GC.todayStr(),agendaDays:30};
var mq=window.matchMedia("(max-width:899px)");
// 보기 모드: auto(폭에 따라) · mobile · desktop — 버튼으로 바꾸면 이 브라우저에 기억
prefs.viewA=prefs.viewA||"auto";
function isMobile(){return prefs.viewA==="mobile"||(prefs.viewA==="auto"&&mq.matches);}
GC.onMedia(mq,function(){GC.render();});
var ICON_PC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
var ICON_M='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>';
function renderViewBtn(){
  var m=isMobile(),b=$("vbtn");
  document.documentElement.classList.toggle("m",m);
  b.innerHTML=(m?ICON_PC:ICON_M)+"<span>"+(m?"PC로 보기":"모바일로 보기")+"</span>";
  b.setAttribute("aria-label",m?"PC 화면으로 보기":"모바일 화면으로 보기");
}

/* 놓치면 안 되는 일정: 60일 안 필기 + 7일 안 서류 마감 */
function renderHl(){
  var box=$("hl"),t=GC.todayStr();box.textContent="";
  var items=GC.upcomingExams(60).map(function(r){return {k:"exam",date:r.d.exam,row:r};})
    .concat(GC.deadlines(7).map(function(r){return {k:"docEnd",date:r.d.docEnd,row:r};}))
    .sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  $("hlsec").hidden=!GC.data||!items.length;
  items.forEach(function(it){
    var s=GC.SMAP[it.k],b=el("button","hlc");b.style.setProperty("--c",GC.cssVar(s.color));
    b.appendChild(el("div","k",s.label));b.appendChild(el("div","n",GC.dlabel(GC.diffDays(t,it.date))));
    b.appendChild(el("div","c",GC.nameOf(it.row)));b.appendChild(el("div","d",GC.fmtMD(it.date)));
    b.onclick=function(){GC.openRow(it.row);};box.appendChild(b);
  });
}

function renderCal(pane){
  var t=GC.todayStr(),mobile=isMobile();
  if(!st.month)st.month=t.slice(0,7);
  var y=+st.month.slice(0,4),m=+st.month.slice(5,7);
  var box=el("div","calbox"),head=el("div","calhead");
  head.appendChild(el("div","ym",y+"년 "+m+"월"));
  var prev=el("button","nav","‹");prev.setAttribute("aria-label","이전 달");prev.onclick=function(){shiftMonth(-1);};
  var next=el("button","nav","›");next.setAttribute("aria-label","다음 달");next.onclick=function(){shiftMonth(1);};
  var tb=el("button","btn","오늘");tb.onclick=function(){st.month=null;st.sel=t;GC.render();};
  head.appendChild(prev);head.appendChild(next);head.appendChild(tb);box.appendChild(head);

  var first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());
  var last=new Date(y,m,0),end=new Date(last);end.setDate(last.getDate()+(6-last.getDay()));
  var byDay=GC.eventsByDay(),grid=el("div","cal");
  GC.DOW.forEach(function(d,i){grid.appendChild(el("div","dow"+(i===0?" sun":i===6?" sat":""),d));});
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1))grid.appendChild(cell(GC.ymd(d),d.getMonth()===m-1,d.getDay(),byDay,t,mobile));
  var sc=el("div","calscroll");sc.appendChild(grid);box.appendChild(sc);
  if(mobile){
    var lg=el("div","legend");
    [["docEnd","마감"],["exam","필기"],["int1","면접"],["final","발표"]].forEach(function(x){
      var sp=el("span"),i=el("i");i.style.setProperty("--c",GC.cssVar(GC.SMAP[x[0]].color));sp.appendChild(i);sp.appendChild(document.createTextNode(x[1]));lg.appendChild(sp);});
    box.appendChild(lg);
  }
  pane.appendChild(box);

  var dp=el("section","daypanel"+(mobile?" listbox":"")),h=el("h2","",GC.fmtLong(st.sel));
  var n=GC.diffDays(t,st.sel);h.appendChild(el("small","",n===0?"오늘":GC.dlabel(n)));dp.appendChild(h);
  var list=byDay[st.sel]||[];
  if(!GC.data)dp.appendChild(el("div","empty-mini","일정을 불러오고 있어요."));
  else if(!list.length)dp.appendChild(el("div","empty-mini","이 날은 일정이 없어요. 점이 있는 날짜를 눌러 보세요."));
  else{var w=el("div","daylist");list.forEach(function(e){w.appendChild(GC.evCard(e,{dday:false}));});dp.appendChild(w);}
  pane.appendChild(dp);
}
function cell(s,inMonth,dow,byDay,t,mobile){
  var c=el("div","cell"+(inMonth?"":" out")+(s===t?" today":"")+(s===st.sel?" sel":""));
  var list=byDay[s]||[];
  c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-label",GC.fmtLong(s)+" 일정 "+list.length+"건");
  var dn=el("div","dn"+(dow===0?" sun":dow===6?" sat":""));dn.appendChild(el("span","",String(+s.slice(8))));c.appendChild(dn);
  if(mobile){
    if(list.length){var row=el("div","dotrow");
      list.slice(0,4).forEach(function(e){var i=el("span","edot");i.style.setProperty("--c",GC.cssVar(GC.SMAP[e.k].color));row.appendChild(i);});
      if(list.length>4)row.appendChild(el("span","moren","+"+(list.length-4)));
      c.appendChild(row);}
  }else{
    list.slice(0,3).forEach(function(e){
      var sg=GC.SMAP[e.k],b=el("button","ec"+(e.k==="exam"?" exam":""));b.style.setProperty("--c",GC.cssVar(sg.color));
      b.appendChild(el("span","bar"));b.appendChild(el("span","s",sg.short));b.appendChild(el("span","t",GC.nameOf(e.row)));
      if(GC.isNew(e.row))b.appendChild(el("span","new","N"));
      b.title=GC.nameOf(e.row)+" · "+sg.label;
      b.onclick=function(ev){ev.stopPropagation();GC.openRow(e.row);};c.appendChild(b);
    });
    if(list.length>3)c.appendChild(el("span","moren","+"+(list.length-3)+"건 더"));
  }
  function pick(){
    st.sel=s;
    if(s.slice(0,7)!==st.month)st.month=s.slice(0,7);
    GC.render();
    if(isMobile()){var dp=document.querySelector(".daypanel");if(dp){var r=dp.getBoundingClientRect();if(r.top>window.innerHeight-120)dp.scrollIntoView({behavior:"smooth",block:"start"});}}
  }
  c.onclick=pick;
  c.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick();}};
  return c;
}
function shiftMonth(n){
  var y=+st.month.slice(0,4),m=+st.month.slice(5,7)-1+n,d=new Date(y,m,1);
  st.month=d.getFullYear()+"-"+GC.pad(d.getMonth()+1);
  var t=GC.todayStr();st.sel=t.slice(0,7)===st.month?t:st.month+"-01";
  GC.render();
}

function renderAgenda(pane){
  var t=GC.todayStr(),until=GC.addDays(t,st.agendaDays),box=el("div","listbox");
  var rb=el("div","rangebtns");
  [[7,"1주"],[30,"30일"],[90,"90일"]].forEach(function(o){
    var b=el("button","chip",o[1]+" 안");b.setAttribute("aria-pressed",st.agendaDays===o[0]?"true":"false");
    b.onclick=function(){st.agendaDays=o[0];GC.render();};rb.appendChild(b);});
  box.appendChild(rb);
  if(!GC.data){box.appendChild(GC.emptyBox("일정을 불러오고 있어요","잠시만 기다려 주세요."));pane.appendChild(box);return;}
  var evs=GC.visibleEvents().filter(function(e){return e.date>=t&&e.date<=until;});
  if(!evs.length)box.appendChild(GC.emptyBox("이 기간에는 일정이 없어요","기간을 늘리거나 필터를 바꿔 보세요."));
  var cur=null,w=null;
  evs.forEach(function(e){
    if(e.date!==cur){cur=e.date;var dw=GC.parseYmd(cur).getDay(),h=el("h3","agh"+(dw===0?" sun":dw===6?" sat":""),GC.fmtLong(cur));
      var n=GC.diffDays(t,cur);h.appendChild(el("small","",n===0?"오늘":GC.dlabel(n)));box.appendChild(h);w=el("div","daylist");box.appendChild(w);}
    w.appendChild(GC.evCard(e,{dday:false}));
  });
  pane.appendChild(box);
}
function renderCo(pane){
  var box=el("div","listbox");
  if(!GC.data){box.appendChild(GC.emptyBox("일정을 불러오고 있어요","잠시만 기다려 주세요."));pane.appendChild(box);return;}
  var rows=GC.activeRows();
  box.appendChild(el("div","note","진행 중이거나 2주 안에 끝난 공고 "+rows.length+"건 · 다음 일정이 가까운 순 · ☆로 관심 기업 표시"));
  if(!rows.length)box.appendChild(GC.emptyBox("조건에 맞는 진행 중 공고가 없어요","검색어나 필터를 바꿔 보세요."));
  var g=el("div","cogrid");rows.forEach(function(r){g.appendChild(GC.coCard(r));});box.appendChild(g);
  pane.appendChild(box);
}

function renderTabs(){document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===prefs.tabA?"true":"false");});}
function renderBadge(){var n=GC.filtersActive(),b=$("fbadge");b.textContent=n;b.classList.toggle("show",n>0);}
// 헤더 요약 숫자 (앱 임베드형 시안에서 보인다)
function renderStats(){
  var box=$("hstats");box.textContent="";if(!GC.data)return;
  [[GC.activeRows().length,"진행 중 공고"],[GC.upcomingExams(7).length,"7일 내 필기"],[GC.deadlines(7).length,"7일 내 마감"]].forEach(function(s){
    var d=el("div","hs");d.appendChild(el("b","",String(s[0])));d.appendChild(el("span","",s[1]));box.appendChild(d);});
}
GC.render=function(){
  renderViewBtn();renderStats();
  $("stamp").textContent=GC.stampText();
  renderHl();renderTabs();renderBadge();GC.renderCount();
  var pane=$("pane");pane.textContent="";
  if(prefs.tabA==="agenda")renderAgenda(pane);else if(prefs.tabA==="co")renderCo(pane);else renderCal(pane);
};
GC.onData=function(){GC.buildFilters($("side"));};

document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){prefs.tabA=b.dataset.tab;GC.savePrefs();GC.render();};});
$("q").addEventListener("input",function(e){GC.state.q=e.target.value.trim();GC.render();});
$("fbtn").onclick=GC.openFilters;
$("vbtn").onclick=function(){
  var want=isMobile()?"desktop":"mobile";
  // 화면 폭이 원래 고를 모드와 같으면 다시 자동으로 둔다
  prefs.viewA=(want==="mobile")===mq.matches?"auto":want;
  GC.savePrefs();GC.render();window.scrollTo(0,0);
};
GC.buildFilters($("side"));
GC.start();
})();
</script>
</body>
</html>
